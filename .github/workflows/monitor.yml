name: Monitor SMU service status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render 무료 티어는 트래픽이 없으면 서버를 재우는데, 그러면 백엔드가
      # 10초마다 자체적으로 도는 상태 캐시 갱신도 같이 멈춘다. 여기서 5분마다
      # 찔러주면(Render의 유휴 판정 15분보다 짧음) 서버가 계속 깨어있는다.
      - name: Ping backend to keep it awake
        run: curl -fsS --max-time 20 https://api.issmuok.site/healthz || true

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run status check
        working-directory: backend
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: go run ./cmd/checkstatus

      - name: Commit status change (if any)
        run: |
          if git diff --quiet -- backend/data/status.json; then
            echo "No status change, skipping commit."
            exit 0
          fi
          git config user.name "smu-server-status-viewer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/data/status.json
          git commit -m "chore: record status change [skip ci]"
          git push
