name: Backend uptime safety net

# 상태 점검·전환 알림은 이제 상시 가동되는 Go 서버(internal/statemonitor)가
# statuscache의 15초 갱신에 붙어서 직접 한다. 이 워크플로는 그 서버가 아예
# 죽었을 때(콜드스타트 실패, 배포 사고 등)를 잡는 2차 안전망일 뿐이다:
# /healthz가 응답하지 않으면 잡을 실패시키고(→ GitHub이 저장소 소유자에게
# 실패 메일 발송), DISCORD_WEBHOOK_OPS가 설정돼 있으면 거기에도 알린다.
#
# 주 깨우기(keepalive)는 외부 업타임 핑거(cron-job.org 등)가 2분 간격으로
# 담당한다 — GitHub Actions 예약 크론은 지연·누락이 잦아 keepalive용으로는
# 신뢰할 수 없기 때문. 그래서 여기 간격도 15분으로 느슨하게 둔다.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: uptime-safety-net
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Probe backend /healthz
        env:
          OPS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_OPS }}
        run: |
          if curl -fsS --max-time 25 https://api.issmuok.site/healthz; then
            echo "backend up"
            exit 0
          fi
          echo "::error::backend /healthz did not respond"
          if [ -n "$OPS_WEBHOOK" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d '{"content":"[SMUON] ⚠️ 백엔드 /healthz 무응답 — 서버 다운 의심 (api.issmuok.site)"}' \
              "$OPS_WEBHOOK" || true
          fi
          exit 1
